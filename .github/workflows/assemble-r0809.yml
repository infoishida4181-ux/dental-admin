name: Assemble facility dataset r0809
on:
  push:
    branches: [main]
    paths:
      - '.tmp-r0809/READY'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and validate dataset
        shell: python
        run: |
          import json
          from pathlib import Path
          parts = sorted(Path(".tmp-r0809").glob("part-*.txt"))
          if not parts:
              raise SystemExit("No dataset chunks found")
          out = Path("assets/data/tokyo-dental-r0809.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          with out.open("wb") as w:
              for p in parts:
                  w.write(p.read_bytes())
          data = json.loads(out.read_text(encoding="utf-8"))
          if data.get("datasetId") != "tokyo-dental-r0809":
              raise SystemExit("Unexpected datasetId")
          if data.get("schemaVersion") != "1.1.0":
              raise SystemExit("Unexpected schemaVersion")
          clinics = data.get("recordsByClinic")
          if not isinstance(clinics, list):
              raise SystemExit("recordsByClinic is not an array")
          institution_count = len(clinics)
          facility_count = sum(len(c.get("facilities", [])) for c in clinics)
          if data.get("institutionCount") != institution_count:
              raise SystemExit("institutionCount mismatch")
          if data.get("facilityCount") != facility_count:
              raise SystemExit("facilityCount mismatch")
          manifest_path = Path("assets/data/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8-sig"))
          manifest["activeDatasetId"] = "tokyo-dental-r0809"
          manifest["datasets"] = [{
              "datasetId": "tokyo-dental-r0809",
              "label": data.get("datasetName", "東京都 歯科施設基準 最新版"),
              "file": "./assets/data/tokyo-dental-r0809.json",
              "sourceDate": data.get("sourceDate", ""),
              "schemaVersion": data.get("schemaVersion", "1.1.0"),
              "format": data.get("format", "grouped-by-clinic")
          }]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Validated: {institution_count} institutions / {facility_count} facilities")
      - name: Commit r0809 dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/data/tokyo-dental-r0809.json
          git add assets/data/manifest.json
          git rm -r .tmp-r0809
          git commit -m "施設基準データをr0809に更新"
          git push origin HEAD:main
